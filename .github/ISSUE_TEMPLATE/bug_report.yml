name: Bug report
description: Report a setup, monitoring or upstream-selection problem.
body:
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Sewage Alerts UK version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the steps, expected result and actual result. Do not share your full postcode or home coordinates.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private locations, tokens and other personal information before posting.
      render: text
